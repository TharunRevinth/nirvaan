version: '3.8'

services:
  besu-node-1:
    image: hyperledger/besu:latest
    container_name: besu-validator-1
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,PERM
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --min-gas-price=0
    ports:
      - "8545:8545"

  ipfs-node:
    image: ipfs/kubo:latest
    container_name: ipfs-storage
    environment:
      - IPFS_PATH=/data/ipfs
    ports:
      - "5001:5001" # API port
      - "8080:8080" # Gateway port
      - "4001:4001" # Swarm port
    volumes:
      - ./ipfs-data:/data/ipfs
